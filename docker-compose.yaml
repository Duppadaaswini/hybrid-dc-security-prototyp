version: "3.8"
services:
  localstack:
    image: localstack/localstack:3.4
    container_name: localstack
    ports:
      - "4566:4566"     # unified LocalStack edge port — all AWS APIs
    environment:
      - SERVICES=ec2,iam,s3,sts
      - DEBUG=1
      - ENFORCE_IAM=1
      - PERSISTENCE=1
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
    # After it's up: http://localhost:8081  (login admin/admin123)
    # Create a realm "campus", a client "faculty-portal", and a test user
    # to simulate the SSO / federated-identity flow described in the design.

