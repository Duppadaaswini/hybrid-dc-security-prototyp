apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b-frontend
  namespace: app-b
spec:
  replicas: 1
  selector:
    matchLabels: { app: app-b-frontend }
  template:
    metadata:
      labels: { app: app-b-frontend, tier: frontend }
    spec:
      containers:
        - name: nginx
          image: nginxdemos/hello:plain-text
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app-b-frontend
  namespace: app-b
spec:
  selector: { app: app-b-frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b-backend
  namespace: app-b
spec:
  replicas: 1
  selector:
    matchLabels: { app: app-b-backend }
  template:
    metadata:
      labels: { app: app-b-backend, tier: backend }
    spec:
      containers:
        - name: nginx
          image: nginxdemos/hello:plain-text
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app-b-backend
  namespace: app-b
spec:
  selector: { app: app-b-backend }
  ports: [{ port: 80, targetPort: 80 }]
